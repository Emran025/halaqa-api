name: Quran Halaqa API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quran-halaqa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Architecture, contracts, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: halaqat_api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite

      - name: Verify database migrations
        run: php artisan migrate --force

      - name: Check Laravel code style
        run: vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test

      - name: Set up Python contract validators
        working-directory: .
        run: python3 -m pip install --disable-pip-version-check --no-input pyyaml openapi-spec-validator

      - name: Validate Laravel architecture tree
        working-directory: .
        run: python3 .agent/scripts/validate_laravel_tree.py halaqat_api --strict

      - name: Validate OpenAPI references and structure
        working-directory: .
        run: |
          python3 .agent/scripts/check_openapi_refs.py
          python3 .agent/scripts/validate_openapi_contract.py .agent/openapi.yaml
          python3 .agent/scripts/audit_openapi_explicit_contract.py
          python3 .agent/scripts/audit_openapi_nested_objects.py
          python3 .agent/scripts/audit_openapi_strictness.py

      - name: Validate database and cross-document alignment
        working-directory: .
        run: |
          python3 .agent/scripts/validate_database_contract.py
          python3 .agent/scripts/validate_api_database_alignment.py
          python3 .agent/scripts/validate_project_policy.py
          python3 .agent/scripts/audit_cross_document_consistency.py

      - name: Enforce Laravel-only and direct P2P implementation policy
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(reverb|pusher|soketi|socket\.io|sipsorcery|stun|turn|media[[:space:]-]?server|relay|proxy)\b' \
              halaqat_api/app halaqat_api/routes halaqat_api/config halaqat_api/composer.json 2>/dev/null; then
            echo 'Forbidden realtime/provider dependency or relay terminology found in executable API files.'
            exit 1
          fi
          if grep -RInE '(Http::|Guzzle|curl_exec|file_get_contents\([[:space:]]*["'"']https?://)' \
              halaqat_api/app 2>/dev/null; then
            echo 'External HTTP integration found in Laravel application code; review against Laravel-only policy.'
            exit 1
          fi
