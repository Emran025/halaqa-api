        country:
          type: [string, 'null']
          maxLength: 100
        city:
          type: [string, 'null']
          maxLength: 100
        residence:
          type: [string, 'null']
          maxLength: 200
        phone:
          type: [string, 'null']
          maxLength: 30
        phone_zone:
          type: [string, 'null']
          maxLength: 8
        whatsapp_phone:
          type: [string, 'null']
          maxLength: 30
        whatsapp_zone:
          type: [string, 'null']
          maxLength: 8
        qualification:
          type: [string, 'null']
          maxLength: 250
        experience_years:
          type: [integer, 'null']
          minimum: 0
          maximum: 80
        available_time:
          type: [string, 'null']
        bio:
          type: [string, 'null']
          maxLength: 2000
        max_halaqas:
          type: [integer, 'null']
          minimum: 0
    UpdateStudentProfileInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: [string, 'null']
          minLength: 2
          maxLength: 120
        birth_date:
          type: [string, 'null']
          format: date
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        country:
          type: [string, 'null']
          maxLength: 100
        city:
          type: [string, 'null']
          maxLength: 100
        residence:
          type: [string, 'null']
          maxLength: 200
        phone:
          type: [string, 'null']
          maxLength: 30
        phone_zone:
          type: [string, 'null']
          maxLength: 8
        whatsapp_phone:
          type: [string, 'null']
          maxLength: 30
        whatsapp_zone:
          type: [string, 'null']
          maxLength: 8
        memorization_level:
          type: [string, 'null']
          maxLength: 120
        review_level:
          type: [string, 'null']
          maxLength: 120
        previous_memorization:
          $ref: '#/components/schemas/PreviousMemorization'
        attendance_preferences:
          $ref: '#/components/schemas/AttendancePreferences'
        follow_up_plan:
          $ref: '#/components/schemas/FollowUpPlanInput'
        bio:
          type: [string, 'null']
          maxLength: 2000
    TeacherProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TeacherProfile'
    TeacherDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TeacherDocument'
    TeacherDocumentCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeacherDocument'
    RealtimeChannelAuthorizationInput:
      type: object
      required: [session_id, channel_name]
      properties:
        session_id:
          type: string
          format: uuid
        channel_name:
          type: string
          pattern: '^private-live-session\\..+'
        client_connection_id:
          type: [string, 'null']
          maxLength: 120
    RealtimeChannelAuthorizationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [authorized, channel_name, session_id, recipient_id]
          properties:
            authorized:
              type: boolean
              const: true
            channel_name:
              type: string
            session_id:
              type: string
              format: uuid
            recipient_id:
              type: string
              format: uuid
            expires_at:
              type: string
              format: date-time
