openapi: 3.1.1
info:
  title: Quran Halaqa Live API
  version: 1.0.0
  description: |
    العقد الرسمي للاتصال بين تطبيق WPF للمعلم أو الطالب وخادم Laravel.
    يستخدم REST للبيانات الرسمية القابلة للحفظ، ويستخدم WebSocket للإشارات
    والأحداث اللحظية. تنتقل الوسائط الصوتية والمرئية عبر WebRTC ولا تمر عبر
    REST أو WebSocket.
  contact:
    name: Quran Halaqa API Team
x-realtime-contract: REALTIME_CONTRACT.md
x-laravel-architecture-reference: references/placement-rules.md
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: https://staging-api.example.com/api/v1
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Halaqas
  - name: Registrations
  - name: Memberships
  - name: Quran
  - name: Sessions
  - name: Tasks
  - name: Mistakes
  - name: Notes
  - name: Evaluations
  - name: Reports
  - name: Progress
  - name: Notifications
  - name: Realtime
paths:
  /auth/register/student:
    post:
      tags: [Auth]
      summary: إنشاء حساب طالب
      operationId: registerStudent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistrationInput'
      responses:
        '201':
          description: تم إنشاء حساب الطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: تم تسجيل الدخول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: تسجيل الخروج وإبطال الرمز الحالي
      operationId: logout
      responses:
        '204':
          description: تم تسجيل الخروج
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: طلب إعادة تعيين كلمة المرور
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '202':
          description: تم قبول الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: إعادة تعيين كلمة المرور
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: تم تغيير كلمة المرور
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password/change:
    post:
      tags: [Auth]
      summary: تغيير كلمة المرور للمستخدم الحالي
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '204':
          description: تم تغيير كلمة المرور
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me:
    get:
      tags: [Profile]
      summary: عرض ملف المستخدم الحالي
      operationId: getCurrentUser
      responses:
        '200':
          description: بيانات المستخدم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags: [Profile]
      summary: تعديل الملف الشخصي
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: تم تحديث الملف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /halaqas:
    get:
      tags: [Halaqas]
      summary: قائمة الحلقات المتاحة أو التابعة للمستخدم
      operationId: listHalaqas
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: قائمة الحلقات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaCollectionResponse'
    post:
      tags: [Halaqas]
      summary: إنشاء حلقة للمعلم الحالي
      operationId: createHalaqa
      x-laravel:
        controller: CreateHalaqaController
        request: StoreHalaqaRequest
        service: CreateHalaqaService
        resource: HalaqaResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHalaqaInput'
      responses:
        '201':
          description: تم إنشاء الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /halaqas/{halaqaId}:
    parameters:
      - $ref: '#/components/parameters/HalaqaId'
    get:
      tags: [Halaqas]
      summary: عرض تفاصيل حلقة
      operationId: getHalaqa
      responses:
        '200':
          description: تفاصيل الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Halaqas]
      summary: تعديل بيانات الحلقة
      operationId: updateHalaqa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHalaqaInput'
      responses:
        '200':
          description: تم تعديل الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /halaqas/{halaqaId}/activate:
    post:
      tags: [Halaqas]
      summary: تفعيل الحلقة
      operationId: activateHalaqa
      parameters:
        - $ref: '#/components/parameters/HalaqaId'
      responses:
        '200':
          description: تم تفعيل الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /halaqas/{halaqaId}/deactivate:
    post:
      tags: [Halaqas]
      summary: إيقاف الحلقة مؤقتًا
      operationId: deactivateHalaqa
      parameters:
        - $ref: '#/components/parameters/HalaqaId'
      responses:
        '200':
          description: تم إيقاف الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /halaqas/{halaqaId}/students:
    parameters:
      - $ref: '#/components/parameters/HalaqaId'
    get:
      tags: [Halaqas, Memberships]
      summary: قائمة طلاب الحلقة
      operationId: listHalaqaStudents
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: طلاب الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Memberships]
      summary: إسناد طالب مقبول إلى الحلقة
      operationId: assignStudentToHalaqa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStudentInput'
      responses:
        '201':
          description: تم إنشاء عضوية الطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /halaqas/{halaqaId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/HalaqaId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [Memberships]
      summary: تغيير حالة عضوية الطالب
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipInput'
      responses:
        '200':
          description: تم تحديث العضوية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memberships]
      summary: إزالة الطالب من الحلقة دون حذف سجله التاريخي
      operationId: removeStudentFromHalaqa
      responses:
        '204':
          description: تمت إزالة العضوية
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /registration-requests:
    get:
      tags: [Registrations]
      summary: قائمة طلبات التسجيل الخاصة بالمستخدم
      operationId: listRegistrationRequests
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/RegistrationState'
        - name: halaqa_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: طلبات التسجيل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCollectionResponse'
  /halaqas/{halaqaId}/registration-requests:
    parameters:
      - $ref: '#/components/parameters/HalaqaId'
    post:
      tags: [Registrations]
      summary: تقديم طالب طلب انضمام إلى الحلقة
      operationId: createRegistrationRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationInput'
      responses:
        '201':
          description: تم إنشاء الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Registrations]
      summary: طلبات التسجيل الواردة إلى الحلقة للمعلم
      operationId: listHalaqaRegistrationRequests
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/RegistrationState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: طلبات التسجيل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /registration-requests/{registrationId}:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    get:
      tags: [Registrations]
      summary: عرض تفاصيل طلب التسجيل
      operationId: getRegistrationRequest
      responses:
        '200':
          description: تفاصيل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Registrations]
      summary: سحب الطالب طلب التسجيل قبل اتخاذ القرار
      operationId: cancelRegistrationRequest
      responses:
        '204':
          description: تم سحب الطلب
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /registration-requests/{registrationId}/accept:
    post:
      tags: [Registrations]
      summary: قبول طلب تسجيل الطالب
      operationId: acceptRegistrationRequest
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: تم قبول الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /registration-requests/{registrationId}/reject:
    post:
      tags: [Registrations]
      summary: رفض طلب تسجيل الطالب
      operationId: rejectRegistrationRequest
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionNoteInput'
      responses:
        '200':
          description: تم رفض الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /registration-requests/{registrationId}/request-completion:
    post:
      tags: [Registrations]
      summary: طلب استكمال بيانات التسجيل
      operationId: requestRegistrationCompletion
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequestInput'
      responses:
        '200':
          description: تم إرسال طلب الاستكمال
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /quran/surahs:
    get:
      tags: [Quran]
      summary: قائمة السور
      operationId: listSurahs
      responses:
        '200':
          description: قائمة السور بالترتيب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurahCollectionResponse'
  /quran/pages/{pageNumber}:
    get:
      tags: [Quran]
      summary: تحميل صفحة من المصحف
      operationId: getQuranPage
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 604
      responses:
        '200':
          description: الصفحة والآيات المرتبطة بها
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuranPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /quran/ayahs/{ayahId}:
    get:
      tags: [Quran]
      summary: عرض آية وكلماتها التفاعلية
      operationId: getAyah
      parameters:
        - name: ayahId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: بيانات الآية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AyahResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions:
    get:
      tags: [Sessions]
      summary: قائمة الجلسات التي يحق للمستخدم رؤيتها
      operationId: listSessions
      parameters:
        - name: halaqa_id
          in: query
          schema:
            type: string
            format: uuid
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/SessionState'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: الجلسات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCollectionResponse'
    post:
      tags: [Sessions]
      summary: إنشاء طلب جلسة مباشرة مع طالب
      operationId: createSession
      x-laravel:
        controller: CreateLiveSessionController
        request: CreateLiveSessionRequest
        service: CreateLiveSessionService
        resource: LiveSessionResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionInput'
      responses:
        '201':
          description: تم إنشاء طلب الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      summary: عرض تفاصيل الجلسة
      operationId: getSession
      responses:
        '200':
          description: تفاصيل الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sessions]
      summary: إلغاء طلب الجلسة قبل اتصالها
      operationId: cancelSession
      responses:
        '204':
          description: تم إلغاء الجلسة
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/accept:
    post:
      tags: [Sessions]
      summary: قبول الطالب طلب الجلسة
      operationId: acceptSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: تم قبول الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/reject:
    post:
      tags: [Sessions]
      summary: رفض الطالب طلب الجلسة
      operationId: rejectSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionNoteInput'
      responses:
        '200':
          description: تم رفض الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/leave:
    post:
      tags: [Sessions]
      summary: مغادرة الجلسة من قبل الطرف الحالي
      operationId: leaveSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: تم تسجيل المغادرة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/end:
    post:
      tags: [Sessions]
      summary: إنهاء الجلسة من قبل المعلم
      operationId: endSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: انتهت الجلسة وبقي التقرير قابلًا للاعتماد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/reconnect:
    post:
      tags: [Sessions, Realtime]
      summary: تسجيل محاولة إعادة الاتصال
      operationId: reconnectSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: بيانات إعادة الاتصال
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeSessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/tasks:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Tasks]
      summary: قائمة مهام الجلسة
      operationId: listSessionTasks
      responses:
        '200':
          description: مهام الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tasks]
