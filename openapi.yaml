openapi: 3.1.1
info:
  title: Quran Halaqa Live API
  version: 1.1.0
  description: |
    العقد الرسمي للاتصال بين تطبيق WPF للمعلم أو الطالب وخادم Laravel الوحيد.
    يستخدم REST للبيانات الرسمية القابلة للحفظ، ويستخدم WebSocket الداخلي المضمن
    داخل Laravel للإشارة وحالة القناة فقط. تنتقل الوسائط الصوتية والمرئية وبيانات
    التفاعل المباشر عبر WebRTC P2P مباشرة بين المعلم والطالب دون Media Server أو
    Relay أو Proxy أو STUN أو TURN أو أي طرف ثالث.
  contact:
    name: Quran Halaqa API Team
x-realtime-contract: REALTIME_CONTRACT.md
x-laravel-architecture-reference: references/placement-rules.md
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: https://staging-api.example.com/api/v1
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Halaqas
  - name: Registrations
  - name: Memberships
  - name: Quran
  - name: Sessions
  - name: Tasks
  - name: Mistakes
  - name: Notes
  - name: Evaluations
  - name: Reports
  - name: Progress
  - name: Notifications
  - name: Realtime
paths:
  /auth/register/student:
    post:
      tags: [Auth]
      summary: إنشاء حساب طالب
      operationId: registerStudent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistrationInput'
      responses:
        '201':
          description: تم إنشاء حساب الطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/register/teacher:
    post:
      tags: [Auth]
      summary: إنشاء حساب معلم وملفه التعريفي
      description: لا تتطلب هذه العملية موافقة إدارية ضمن النطاق الحالي؛ ينشأ حساب المعلم وفق سياسة التسجيل المعتمدة.
      operationId: registerTeacher
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherRegistrationInput'
      responses:
        '201':
          description: تم إنشاء حساب المعلم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: تم تسجيل الدخول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: تسجيل الخروج وإبطال الرمز الحالي
      operationId: logout
      responses:
        '204':
          description: تم تسجيل الخروج
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: طلب إعادة تعيين كلمة المرور
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '202':
          description: تم قبول الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: إعادة تعيين كلمة المرور
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: تم تغيير كلمة المرور
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password/change:
    post:
      tags: [Auth]
      summary: تغيير كلمة المرور للمستخدم الحالي
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '204':
          description: تم تغيير كلمة المرور
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/student-profile:
    get:
      tags: [Profile]
      summary: عرض الملف التفصيلي للطالب الحالي
      operationId: getCurrentStudentProfile
      responses:
        '200':
          description: الملف التفصيلي وخطة الطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Profile]
      summary: تعديل الملف التفصيلي للطالب الحالي
      operationId: updateCurrentStudentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileInput'
      responses:
        '200':
          description: تم تحديث ملف الطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me:
    get:
      tags: [Profile]
      summary: عرض ملف المستخدم الحالي
      operationId: getCurrentUser
      responses:
        '200':
          description: بيانات المستخدم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags: [Profile]
      summary: تعديل الملف الشخصي
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: تم تحديث الملف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/teacher-profile:
    get:
      tags: [Profile]
      summary: عرض الملف التفصيلي للمعلم الحالي
      operationId: getCurrentTeacherProfile
      responses:
        '200':
          description: الملف التفصيلي للمعلم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Profile]
      summary: تعديل الملف التفصيلي للمعلم الحالي
      operationId: updateCurrentTeacherProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherProfileInput'
      responses:
        '200':
          description: تم تحديث ملف المعلم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/teacher-documents:
    get:
      tags: [Profile]
      summary: قائمة مؤهلات ووثائق المعلم الحالي
      operationId: listCurrentTeacherDocuments
      responses:
        '200':
          description: وثائق المعلم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDocumentCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Profile]
      summary: إرفاق مؤهل أو وثيقة للمعلم
      operationId: createTeacherDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeacherDocumentUploadInput'
      responses:
        '201':
          description: تم حفظ الوثيقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDocumentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/teacher-documents/{documentId}:
    delete:
      tags: [Profile]
      summary: حذف وثيقة المعلم الحالية
      operationId: deleteTeacherDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: تم حذف الوثيقة
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teachers:
    get:
      tags: [Profile]
      summary: قائمة المعلمين المتاحين للطالب
      description: يعيد بيانات عامة فقط. لا تظهر بيانات التواصل أو الملف التفصيلي قبل قبول طلب الطالب وبدء العلاقة التعليمية.
      operationId: listAvailableTeachers
      parameters:
        - name: code
          in: query
          description: كود معلم اختياري؛ عند وجوده يعاد المعلم المطابق فقط.
          schema:
            type: [string, 'null']
            maxLength: 40
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: قائمة عامة للمعلمين
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPublicCollectionResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teachers/{teacherId}:
    get:
      tags: [Profile]
      summary: عرض بطاقة معلم عامة
      operationId: getPublicTeacher
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: بيانات عامة للمعلم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPublicResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /student-applications:
    get:
      tags: [Registrations]
      summary: صندوق طلبات الطلاب المتاحة للمعلم
      description: يعرض المتقدمين الموجهين إلى كود المعلم أو الطلبات العامة التي ترك فيها الطالب كود المعلم فارغًا، دون البيانات الحساسة قبل القبول وبدء العلاقة التعليمية.
      operationId: listTeacherApplicationInbox
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, completion_requested, accepted, rejected]
            default: pending
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: قائمة متقدمين ببيانات عامة فقط قبل القبول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Profile]
      summary: عرض ملف الطالب التفصيلي
      description: يظهر للطالب نفسه، وللمعلم فقط بعد قبول الطالب وبدء العلاقة التعليمية أو وجود جلسة معتمدة. لا يظهر الملف التفصيلي للمعلمين الآخرين.
      operationId: getStudentProfile
      responses:
        '200':
          description: الملف التفصيلي للطالب مع مستوى الخصوصية المسموح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{studentId}/follow-up-plan:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Progress]
      summary: عرض خطة الحفظ والمراجعة والتلاوة
      operationId: getStudentFollowUpPlan
      responses:
        '200':
          description: خطة المتابعة الحالية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpPlanResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Progress]
      summary: اعتماد أو تحديث خطة متابعة الطالب
      description: يسمح للمعلم بتثبيت الخطة بعد القبول، ويُسمح للطالب بتعديل مقترحه قبل اعتماد المعلم وفق حالة العلاقة.
      operationId: updateStudentFollowUpPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUpPlanInput'
      responses:
        '200':
          description: تم تحديث الخطة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpPlanResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /students/{studentId}/availability:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Progress]
      summary: عرض أوقات حضور الطالب المتاحة
      operationId: getStudentAvailability
      responses:
        '200':
          description: أوقات الحضور والمنطقة الزمنية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancePreferencesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Progress]
      summary: تحديث أوقات حضور الطالب
      operationId: updateStudentAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendancePreferences'
      responses:
        '200':
          description: تم تحديث أوقات الحضور
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancePreferencesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /follow-up-items:
    get:
      tags: [Progress, Sessions]
      summary: قائمة المتابعة اليومية المجدولة
      description: يعيد للمعلم قائمة طلابه المستحقين للمتابعة، ويعيد للطالب عناصر متابعته الشخصية فقط.
      operationId: listFollowUpItems
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: state
          in: query
          schema:
            type: string
            enum: [upcoming, due, in_progress, completed, skipped, overdue]
        - name: task_type
          in: query
          schema:
            $ref: '#/components/schemas/TaskType'
        - name: student_id
          in: query
          description: للمعلم فقط.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: عناصر المتابعة والجدولة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpItemCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /follow-up-items/{followUpItemId}/complete:
    post:
      tags: [Progress]
      summary: تعليم عنصر المتابعة كمكتمل
      operationId: completeFollowUpItem
      parameters:
        - $ref: '#/components/parameters/FollowUpItemId'
      responses:
        '200':
          description: تم تحديث عنصر المتابعة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpItemResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /follow-up-items/{followUpItemId}/skip:
    post:
      tags: [Progress]
      summary: تجاوز عنصر متابعة مع تسجيل السبب
      operationId: skipFollowUpItem
      parameters:
        - $ref: '#/components/parameters/FollowUpItemId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipFollowUpInput'
      responses:
        '200':
          description: تم تجاوز العنصر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpItemResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /follow-up-items/{followUpItemId}/reschedule:
    post:
      tags: [Progress]
      summary: إعادة جدولة عنصر المتابعة
      operationId: rescheduleFollowUpItem
      parameters:
        - $ref: '#/components/parameters/FollowUpItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleFollowUpInput'
      responses:
        '200':
          description: تم تحديث الموعد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpItemResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /students/{studentId}/trackings:
    get:
      tags: [Progress]
      summary: سجل المتابعة اليومية والحضور للطالب
      operationId: listStudentTrackings
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: سجلات المتابعة اليومية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /halaqas:
    get:
      tags: [Halaqas]
      summary: قائمة الحلقات المتاحة أو التابعة للمستخدم
      operationId: listHalaqas
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: قائمة الحلقات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaCollectionResponse'
    post:
      tags: [Halaqas]
      summary: إنشاء حلقة للمعلم الحالي
      operationId: createHalaqa
      x-laravel:
        controller: CreateHalaqaController
        request: StoreHalaqaRequest
        service: CreateHalaqaService
        resource: HalaqaResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHalaqaInput'
      responses:
        '201':
          description: تم إنشاء الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /halaqas/{halaqaId}:
    parameters:
      - $ref: '#/components/parameters/HalaqaId'
    get:
      tags: [Halaqas]
      summary: عرض تفاصيل حلقة
      operationId: getHalaqa
      responses:
        '200':
          description: تفاصيل الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Halaqas]
      summary: تعديل بيانات الحلقة
      operationId: updateHalaqa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHalaqaInput'
      responses:
        '200':
          description: تم تعديل الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /halaqas/{halaqaId}/activate:
    post:
      tags: [Halaqas]
      summary: تفعيل الحلقة
      operationId: activateHalaqa
      parameters:
        - $ref: '#/components/parameters/HalaqaId'
      responses:
        '200':
          description: تم تفعيل الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /halaqas/{halaqaId}/deactivate:
    post:
      tags: [Halaqas]
      summary: إيقاف الحلقة مؤقتًا
      operationId: deactivateHalaqa
      parameters:
        - $ref: '#/components/parameters/HalaqaId'
      responses:
        '200':
          description: تم إيقاف الحلقة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalaqaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /halaqas/{halaqaId}/students:
    parameters:
      - $ref: '#/components/parameters/HalaqaId'
    get:
      tags: [Halaqas, Memberships]
      summary: قائمة طلاب الحلقة
