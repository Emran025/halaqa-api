    get:
      tags: [Evaluations]
      summary: عرض تقييمات المهمة
      operationId: getTaskEvaluations
      responses:
        '200':
          description: تقييم المعلم والتقييم الذاتي للطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Evaluations]
      summary: إنشاء أو تحديث تقييم المهمة
      operationId: upsertTaskEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertEvaluationInput'
      responses:
        '200':
          description: تم حفظ التقييم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions/{sessionId}/mushaf-state:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Quran, Sessions]
      summary: استعادة آخر حالة للمصحف في الجلسة
      operationId: getSessionMushafState
      responses:
        '200':
          description: موضع المصحف والنطاق الحالي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MushafStateResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Quran, Sessions]
      summary: حفظ موضع المصحف ونطاق التلاوة
      operationId: saveSessionMushafState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMushafStateInput'
      responses:
        '200':
          description: تم حفظ حالة المصحف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MushafStateResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions/{sessionId}/realtime:
    get:
      tags: [Realtime]
      summary: الحصول على بيانات قناة الجلسة وخوادم ICE
      operationId: getRealtimeSessionConfig
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: إعدادات WebSocket وWebRTC للإصدار الحالي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeSessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /realtime/channels/authorize:
    post:
      tags: [Realtime]
      summary: تفويض قناة WebSocket الداخلية
      description: يفوض قناة جلسة خاصة داخل خادم Laravel WebSocket المضمن، ولا يعتمد على Laravel Broadcasting أو مزود خارجي.
      operationId: authorizeRealtimeChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeChannelAuthorizationInput'
      responses:
        '200':
          description: تم تفويض القناة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeChannelAuthorizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{sessionId}/report:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Reports]
      summary: عرض تقرير الجلسة
      operationId: getSessionReport
      responses:
        '200':
          description: تقرير الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Reports]
      summary: تعديل بيانات التقرير قبل الاعتماد
      operationId: updateSessionReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportInput'
      responses:
        '200':
          description: تم تعديل التقرير
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions/{sessionId}/report/teacher-approval:
    post:
      tags: [Reports]
      summary: اعتماد المعلم النهائي لتقرير الجلسة
      operationId: approveSessionReportByTeacher
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalInput'
      responses:
        '200':
          description: تم اعتماد التقرير
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/report/student-acknowledgment:
    post:
      tags: [Reports]
      summary: تأكيد الطالب اطلاعه على التقرير أو تسجيل ملاحظة
      operationId: acknowledgeSessionReportByStudent
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentAcknowledgmentInput'
      responses:
        '200':
          description: تم تسجيل تأكيد الطالب أو ملاحظته
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{sessionId}/report/reopen:
    post:
      tags: [Reports]
      summary: إعادة فتح تقرير مكتمل للمعلم
      operationId: reopenSessionReport
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenReportInput'
      responses:
        '200':
          description: أعيد فتح التقرير
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /students/{studentId}/progress:
    get:
      tags: [Progress]
      summary: عرض تقدم الطالب
      operationId: getStudentProgress
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - name: task_type
          in: query
          schema:
            $ref: '#/components/schemas/TaskType'
      responses:
        '200':
          description: تقدم الطالب وآخر نقطة مكتملة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{studentId}/reports:
    get:
      tags: [Progress, Reports]
      summary: سجل تقارير الطالب
      operationId: listStudentReports
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - name: task_type
          in: query
          schema:
            $ref: '#/components/schemas/TaskType'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: التقارير
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /students/{studentId}/mistakes:
    get:
      tags: [Progress, Mistakes]
      summary: سجل أخطاء الطالب مع مواضعها في المصحف
      operationId: listStudentMistakes
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - name: task_type
          in: query
          schema:
            $ref: '#/components/schemas/TaskType'
        - name: mistake_type
          in: query
          schema:
            $ref: '#/components/schemas/MistakeType'
        - name: page_from
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page_to
          in: query
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: أخطاء الطالب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MistakeCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      tags: [Notifications]
      summary: قائمة إشعارات المستخدم
      operationId: listNotifications
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: الإشعارات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCollectionResponse'
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: تعليم إشعار كمقروء
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: تم تعليم الإشعار كمقروء
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: تعليم جميع الإشعارات كمقروءة
      operationId: markAllNotificationsRead
      responses:
        '204':
          description: تم تعليم الإشعارات كمقروءة
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
  parameters:
    HalaqaId:
      name: halaqaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MistakeId:
      name: mistakeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FollowUpItemId:
      name: followUpItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    Status:
      name: status
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: المصادقة مفقودة أو غير صالحة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: المستخدم مصادق عليه لكنه غير مخول
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: المورد غير موجود أو غير ظاهر للمستخدم
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: تعارض مع حالة المورد الحالية أو عملية مكررة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: فشل التحقق من المدخلات
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    Role:
      type: string
      enum: [teacher, student]
    User:
      type: object
      required: [id, role, name, email, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        status:
          type: string
          enum: [active, pending, suspended]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [data, token]
      properties:
        data:
          $ref: '#/components/schemas/User'
        token:
          type: string
        token_type:
          type: string
          example: Bearer
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    StudentRegistrationInput:
      type: object
      required: [name, email, password, password_confirmation, gender, birth_date, country, city, phone, phone_zone, attendance_preferences, follow_up_plan]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        username:
          type: [string, 'null']
          minLength: 3
          maxLength: 60
          pattern: '^[A-Za-z0-9_.-]+$'
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
        gender:
          $ref: '#/components/schemas/Gender'
        birth_date:
          type: string
          format: date
        country:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        residence:
          type: [string, 'null']
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        phone_zone:
          type: string
          maxLength: 8
        whatsapp_phone:
          type: [string, 'null']
          maxLength: 30
        whatsapp_zone:
          type: [string, 'null']
          maxLength: 8
        memorization_level:
          type: [string, 'null']
          maxLength: 120
        review_level:
          type: [string, 'null']
          maxLength: 120
        previous_memorization:
          $ref: '#/components/schemas/PreviousMemorization'
        attendance_preferences:
          $ref: '#/components/schemas/AttendancePreferences'
        follow_up_plan:
          $ref: '#/components/schemas/FollowUpPlanInput'
        teacher_code:
          type: [string, 'null']
          description: إذا ترك فارغًا يظهر الطلب للمعلمين المؤهلين كافة دون البيانات الحساسة.
          maxLength: 40
        profile_bio:
          type: [string, 'null']
          maxLength: 2000
    TeacherRegistrationInput:
      type: object
      required: [name, email, password, password_confirmation, gender, birth_date, country, city, phone, phone_zone, qualification, experience_years]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        username:
          type: [string, 'null']
          minLength: 3
          maxLength: 60
          pattern: '^[A-Za-z0-9_.-]+$'
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
        gender:
          $ref: '#/components/schemas/Gender'
        birth_date:
          type: string
          format: date
        country:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        residence:
          type: [string, 'null']
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        phone_zone:
          type: string
          maxLength: 8
        whatsapp_phone:
          type: [string, 'null']
          maxLength: 30
        whatsapp_zone:
          type: [string, 'null']
          maxLength: 8
        qualification:
          type: string
          maxLength: 250
        experience_years:
          type: integer
          minimum: 0
          maximum: 80
        bio:
          type: [string, 'null']
          maxLength: 2000
        available_time:
          type: [string, 'null']
          description: التوقيت المحلي المعتاد بصيغة HH:mm أو وصف زمني معتمد.
        documents:
          type: array
          items:
            $ref: '#/components/schemas/TeacherDocumentInput'
        max_halaqas:
          type: integer
