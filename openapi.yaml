        name:
          type: string
          maxLength: 250
        certificate_type:
          type: string
          maxLength: 100
        certificate_type_other:
          type: [string, 'null']
          maxLength: 150
        riwayah:
          type: [string, 'null']
          maxLength: 100
        issuing_place:
          type: [string, 'null']
          maxLength: 200
        issuing_date:
          type: [string, 'null']
